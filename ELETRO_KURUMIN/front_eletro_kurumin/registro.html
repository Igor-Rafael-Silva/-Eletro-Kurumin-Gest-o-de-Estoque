<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletro Kurumin - Criar Conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Eletro Kurumin</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Crie a sua conta para aceder ao sistema</p>
        
        <form id="form-registro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="O seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu.email@eletrokurumin.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" name="senha" placeholder="******" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar Palavra-passe</label>
                <input type="password" id="confirmar-senha" placeholder="******" required minlength="6">
            </div>

            <button type="submit">Criar Conta</button>
        </form>

        <a href="index.html" class="link-registro">Já tem uma conta? Iniciar Sessão</a>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
