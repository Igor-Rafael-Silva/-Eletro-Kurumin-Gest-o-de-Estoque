<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletro Kurumin - Painel de Controlo</title>
    <link rel="stylesheet" href="css/interface.css">
</head>
<body>
    <header>
        <h2>Eletro Kurumin - Stock</h2>
        <div>
            <span id="user-name">Utilizador</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard / KPIs -->
        <section class="kpis">
            <div class="card">
                <h3>Valor Total em Stock</h3>
                <p id="kpi-valor-total">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Total de Unidades</h3>
                <p id="kpi-total-unidades">0</p>
            </div>
            <div class="card">
                <h3>Tipos de Componentes</h3>
                <p id="kpi-total-itens">0</p>
            </div>
        </section>

        <!-- Form de Novo Componente -->
        <section class="form-container">
            <h3>Adicionar Novo Componente</h3>
            <form id="form-componente" class="form-grid">
                <input type="text" id="comp-nome" placeholder="Nome do Componente" required>
               <!-- Subtituir o input de categoria por este select -->
                <select id="comp-categoria" required>
                    <option value="">Selecione a Categoria</option>
                </select>
                <input type="number" step="0.01" id="comp-preco" placeholder="Preço (R$)" required min="0">
                <input type="number" id="comp-qtd" placeholder="Qtd. Inicial em Stock" required min="0">
                <input type="text" id="comp-desc" placeholder="Descrição" style="grid-column: span 2;">
                <button type="submit" class="btn-add">Adicionar Componente</button>
            </form>
        </section>

        <br>

        <!-- Tabela de Componentes -->
        <section>
            <h3>Componentes em Stock</h3>
            <br>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Qtd. Stock</th>
                            <th>Preço Unitário</th>
                            <th>Subtotal</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-componentes">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="js/componentes.js"></script>
</body>
</html>
